
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans, sans-serif); }

  .arena-bg {
    min-height: 100vh;
    background: #0a0e1a;
    position: relative;
    overflow: hidden;
    padding: 1.5rem 1rem;
  }

  .field-lines {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    opacity: 0.18;
    animation: float linear infinite;
  }

  @keyframes float {
    0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
    10% { opacity: 0.18; }
    90% { opacity: 0.12; }
    100% { transform: translateY(-120px) scale(1.1); opacity: 0; }
  }

  @keyframes pulse-ring {
    0% { transform: scale(0.85); opacity: .6; }
    100% { transform: scale(1.15); opacity: 0; }
  }

  @keyframes shimmer {
    0%, 100% { opacity: .25; }
    50% { opacity: .55; }
  }

  .arena { position: relative; z-index: 2; max-width: 680px; margin: 0 auto; }

  .badge { display: inline-block; font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 20px; letter-spacing: .04em; background: rgba(55,138,221,.18); color: #85B7EB; border: 0.5px solid rgba(55,138,221,.35); }
  .big-title { font-size: 28px; font-weight: 500; color: #fff; margin: .5rem 0 .25rem; }
  .sub { font-size: 14px; color: rgba(255,255,255,.55); margin-bottom: 1.5rem; }

  .screen { display: none; }
  .screen.active { display: block; }

  .rules-box { background: rgba(255,255,255,.06); border: 0.5px solid rgba(255,255,255,.12); border-radius: var(--border-radius-md); padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
  .rules-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; color: rgba(255,255,255,.6); border-bottom: 0.5px solid rgba(255,255,255,.07); }
  .rules-row:last-child { border-bottom: none; }
  .rules-icon { font-size: 18px; width: 24px; text-align: center; }

  .player-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1rem; }
  .input-wrap { display: flex; flex-direction: column; gap: 6px; }
  .input-wrap label { font-size: 12px; font-weight: 500; color: rgba(255,255,255,.45); letter-spacing: .05em; text-transform: uppercase; }
  input[type=text] { padding: 10px 12px; font-size: 15px; border-radius: var(--border-radius-md); border: 0.5px solid rgba(255,255,255,.18); background: rgba(255,255,255,.07); color: #fff; width: 100%; outline: none; transition: border .15s, box-shadow .15s; }
  input[type=text]::placeholder { color: rgba(255,255,255,.3); }
  input[type=text]:focus { border-color: #378ADD; box-shadow: 0 0 0 3px rgba(55,138,221,.2); }

  .btn-main { width: 100%; padding: 13px; font-size: 15px; font-weight: 500; border-radius: var(--border-radius-md); background: #185FA5; color: #E6F1FB; border: none; cursor: pointer; transition: background .15s, transform .1s; margin-top: .5rem; }
  .btn-main:hover { background: #378ADD; }
  .btn-main:active { transform: scale(0.98); }
  .btn-main:disabled { opacity: .4; cursor: default; }

  .scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin-bottom: 1.5rem; }
  .player-card { background: rgba(255,255,255,.07); border: 0.5px solid rgba(255,255,255,.14); border-radius: var(--border-radius-lg); padding: 1rem; text-align: center; }
  .player-name { font-size: 13px; font-weight: 500; color: rgba(255,255,255,.55); margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player-score { font-size: 34px; font-weight: 500; color: #fff; }
  .vs-badge { font-size: 13px; font-weight: 500; color: rgba(255,255,255,.4); text-align: center; }

  .moves-section { margin-bottom: 1.25rem; }
  .phase-label { font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.45); margin-bottom: .7rem; }
  .moves-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .move-btn { padding: 18px 6px; border-radius: var(--border-radius-md); border: 0.5px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); cursor: pointer; text-align: center; transition: border .15s, background .15s, transform .12s; }
  .move-btn:hover { border-color: #378ADD; background: rgba(55,138,221,.14); }
  .move-btn.selected { border: 2px solid #378ADD; background: rgba(55,138,221,.2); }
  .move-btn:active { transform: scale(0.95); }
  .move-icon { font-size: 32px; display: block; margin-bottom: 5px; }
  .move-name { font-size: 12px; font-weight: 500; color: rgba(255,255,255,.6); }

  .result-card { border-radius: var(--border-radius-lg); border: 0.5px solid rgba(255,255,255,.14); padding: 1.5rem; text-align: center; background: rgba(255,255,255,.06); margin-bottom: 1rem; }
  .result-card.winner-glow { border-color: #378ADD; background: rgba(55,138,221,.12); }
  .result-moves { display: flex; justify-content: center; align-items: center; gap: 1rem; font-size: 13px; color: rgba(255,255,255,.5); margin-bottom: .75rem; }
  .result-move-pill { background: rgba(255,255,255,.1); border-radius: 20px; padding: 5px 14px; font-weight: 500; display: flex; align-items: center; gap: 6px; color: rgba(255,255,255,.85); }
  .result-headline { font-size: 22px; font-weight: 500; color: #fff; margin-bottom: 4px; }
  .result-sub { font-size: 13px; color: rgba(255,255,255,.5); }

  .btn-row { display: flex; gap: 8px; }
  .btn-sec { flex: 1; padding: 11px; font-size: 14px; font-weight: 500; border-radius: var(--border-radius-md); background: rgba(255,255,255,.07); border: 0.5px solid rgba(255,255,255,.18); color: rgba(255,255,255,.8); cursor: pointer; transition: background .15s; }
  .btn-sec:hover { background: rgba(255,255,255,.12); }

  .error-msg { font-size: 12px; color: #F09595; margin-top: 4px; display: none; }
</style>

<div class="arena-bg" id="bg">
  <svg class="field-lines" viewBox="0 0 700 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <circle cx="350" cy="400" r="180" fill="none" stroke="rgba(55,138,221,0.13)" stroke-width="1"/>
    <circle cx="350" cy="400" r="320" fill="none" stroke="rgba(55,138,221,0.07)" stroke-width="1"/>
    <circle cx="350" cy="400" r="460" fill="none" stroke="rgba(55,138,221,0.05)" stroke-width="1"/>
    <line x1="350" y1="0" x2="350" y2="800" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <line x1="0" y1="400" x2="700" y2="400" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <circle cx="350" cy="400" r="12" fill="rgba(55,138,221,0.22)"/>
    <circle cx="350" cy="400" r="5" fill="rgba(55,138,221,0.6)"/>
    <rect x="120" y="260" width="460" height="280" rx="6" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <rect x="230" y="310" width="240" height="180" rx="4" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <circle cx="350" cy="400" r="180" fill="none" stroke="rgba(55,138,221,0.1)" stroke-width="1" style="animation: shimmer 3s ease-in-out infinite;"/>
  </svg>

  <div id="particles"></div>

  <div class="arena">

    <div id="screen-setup" class="screen active">
      <div style="margin-bottom:1.25rem;">
        <span class="badge">Pedra · Papel · Tesoura</span>
        <h1 class="big-title">Arena dos Campeões</h1>
        <p class="sub">Digite os nomes dos jogadores para começar a disputa.</p>
      </div>
      <div class="rules-box">
        <div class="rules-row"><span class="rules-icon">🪨</span> Pedra vence Tesoura</div>
        <div class="rules-row"><span class="rules-icon">📄</span> Papel vence Pedra</div>
        <div class="rules-row"><span class="rules-icon">✂️</span> Tesoura vence Papel</div>
      </div>
      <div class="player-row">
        <div class="input-wrap">
          <label>Jogador 1</label>
          <input type="text" id="inp1" placeholder="Ex: Arlindo" maxlength="16"/>
          <span class="error-msg" id="err1">Informe o nome</span>
        </div>
        <div class="input-wrap">
          <label>Jogador 2</label>
          <input type="text" id="inp2" placeholder="Ex: Lima" maxlength="16"/>
          <span class="error-msg" id="err2">Informe o nome</span>
        </div>
      </div>
      <button class="btn-main" onclick="startGame()">Entrar na Arena ↗</button>
    </div>

    <div id="screen-play" class="screen">
      <div class="scoreboard">
        <div class="player-card">
          <div class="player-name" id="sc-name1">—</div>
          <div class="player-score" id="sc-pts1">0</div>
        </div>
        <div class="vs-badge">VS</div>
        <div class="player-card">
          <div class="player-name" id="sc-name2">—</div>
          <div class="player-score" id="sc-pts2">0</div>
        </div>
      </div>
      <div id="phase-p1" class="moves-section">
        <div class="phase-label" id="move-label-p1">Escolha do Jogador 1</div>
        <div class="moves-grid">
          <button class="move-btn" onclick="selectMove(1,'pedra')"><span class="move-icon">🪨</span><span class="move-name">Pedra</span></button>
          <button class="move-btn" onclick="selectMove(1,'papel')"><span class="move-icon">📄</span><span class="move-name">Papel</span></button>
          <button class="move-btn" onclick="selectMove(1,'tesoura')"><span class="move-icon">✂️</span><span class="move-name">Tesoura</span></button>
        </div>
      </div>
      <div id="phase-p2" class="moves-section" style="display:none">
        <div class="phase-label" id="move-label-p2">Escolha do Jogador 2</div>
        <div class="moves-grid">
          <button class="move-btn" onclick="selectMove(2,'pedra')"><span class="move-icon">🪨</span><span class="move-name">Pedra</span></button>
          <button class="move-btn" onclick="selectMove(2,'papel')"><span class="move-icon">📄</span><span class="move-name">Papel</span></button>
          <button class="move-btn" onclick="selectMove(2,'tesoura')"><span class="move-icon">✂️</span><span class="move-name">Tesoura</span></button>
        </div>
      </div>
      <button class="btn-sec" style="width:100%;margin-top:.5rem;" onclick="goSetup()">← Sair da Arena</button>
    </div>

    <div id="screen-result" class="screen">
      <div id="result-card" class="result-card">
        <div class="result-moves" id="result-moves"></div>
        <div class="result-headline" id="result-headline"></div>
        <div class="result-sub" id="result-sub"></div>
      </div>
      <div class="scoreboard" style="margin-bottom:1rem;">
        <div class="player-card">
          <div class="player-name" id="res-name1">—</div>
          <div class="player-score" id="res-pts1">0</div>
        </div>
        <div class="vs-badge">placar</div>
        <div class="player-card">
          <div class="player-name" id="res-name2">—</div>
          <div class="player-score" id="res-pts2">0</div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn-sec" onclick="goSetup()">Novo Jogo</button>
        <button class="btn-main" onclick="nextRound()" style="flex:2;margin-top:0;">Próxima Rodada ↗</button>
      </div>
    </div>

  </div>
</div>

<script>
  const icons = { pedra: '🪨', papel: '📄', tesoura: '✂️' };
  let p1='', p2='', pts1=0, pts2=0, move1='', move2='';

  (function spawnParticles() {
    const container = document.getElementById('particles');
    const colors = ['#378ADD','#185FA5','#85B7EB','#B5D4F4','#5DCAA5','#1D9E75'];
    for (let i = 0; i < 28; i++) {
      const el = document.createElement('div');
      el.className = 'particle';
      const size = 4 + Math.random() * 10;
      el.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${6+Math.random()*10}s;animation-delay:${Math.random()*10}s;`;
      container.appendChild(el);
    }
  })();

  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function startGame() {
    const v1 = document.getElementById('inp1').value.trim();
    const v2 = document.getElementById('inp2').value.trim();
    let ok = true;
    document.getElementById('err1').style.display = v1 ? 'none' : 'block'; if (!v1) ok = false;
    document.getElementById('err2').style.display = v2 ? 'none' : 'block'; if (!v2) ok = false;
    if (!ok) return;
    p1=v1; p2=v2; pts1=0; pts2=0;
    updateScoreboard();
    document.getElementById('move-label-p1').textContent = p1 + ', escolha sua jogada';
    document.getElementById('move-label-p2').textContent = p2 + ', escolha sua jogada';
    move1=''; move2='';
    resetMoveButtons();
    document.getElementById('phase-p1').style.display = 'block';
    document.getElementById('phase-p2').style.display = 'none';
    show('screen-play');
  }

  function updateScoreboard() {
    ['sc-name1','res-name1'].forEach(id => document.getElementById(id).textContent = p1);
    ['sc-name2','res-name2'].forEach(id => document.getElementById(id).textContent = p2);
    ['sc-pts1','res-pts1'].forEach(id => document.getElementById(id).textContent = pts1);
    ['sc-pts2','res-pts2'].forEach(id => document.getElementById(id).textContent = pts2);
  }

  function resetMoveButtons() {
    document.querySelectorAll('.move-btn').forEach(b => b.classList.remove('selected'));
  }

  function selectMove(player, choice) {
    if (player === 1) {
      move1 = choice;
      document.getElementById('phase-p1').querySelectorAll('.move-btn').forEach((b,i) => b.classList.toggle('selected', ['pedra','papel','tesoura'][i] === choice));
      setTimeout(() => {
        document.getElementById('phase-p1').style.display = 'none';
        document.getElementById('phase-p2').style.display = 'block';
      }, 320);
    } else {
      move2 = choice;
      document.getElementById('phase-p2').querySelectorAll('.move-btn').forEach((b,i) => b.classList.toggle('selected', ['pedra','papel','tesoura'][i] === choice));
      setTimeout(resolveRound, 400);
    }
  }

  function resolveRound() {
    const wins = { pedra: 'tesoura', papel: 'pedra', tesoura: 'papel' };
    let winner = move1 === move2 ? 0 : wins[move1] === move2 ? 1 : 2;
    if (winner === 1) pts1++;
    else if (winner === 2) pts2++;
    updateScoreboard();
    document.getElementById('result-moves').innerHTML = `<div class="result-move-pill">${icons[move1]} ${p1}</div><span style="color:rgba(255,255,255,.35)">vs</span><div class="result-move-pill">${icons[move2]} ${p2}</div>`;
    const card = document.getElementById('result-card');
    if (winner === 0) {
      document.getElementById('result-headline').textContent = 'Empate!';
      document.getElementById('result-sub').textContent = p1 + ' e ' + p2 + ' fizeram a mesma jogada.';
      card.classList.remove('winner-glow');
    } else {
      const w = winner === 1 ? p1 : p2;
      document.getElementById('result-headline').textContent = w + ' venceu!';
      document.getElementById('result-sub').textContent = icons[move1] + ' ' + move1 + '  vs  ' + icons[move2] + ' ' + move2;
      card.classList.add('winner-glow');
    }
    show('screen-result');
  }

  function nextRound() {
    move1=''; move2='';
    resetMoveButtons();
    document.getElementById('phase-p1').style.display='block';
    document.getElementById('phase-p2').style.display='none';
    show('screen-play');
  }

  function goSetup() {
    document.getElementById('inp1').value='';
    document.getElementById('inp2').value='';
    show('screen-setup');
  }

  document.getElementById('inp1').addEventListener('input', () => document.getElementById('err1').style.display='none');
  document.getElementById('inp2').addEventListener('input', () => document.getElementById('err2').style.display='none');
  document.getElementById('inp2').addEventListener('keydown', e => { if (e.key==='Enter') startGame(); });
</script>
